[package]
name = "nucleus"
version = "1.0.0"
edition = "2024"
authors = ["Red Kalab <red@uncollapse.com>", "Ash <folf@uncollapse.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
bench = false

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false


[dependencies]
nucleus_macros = { version = "1.0.0", path = "../nucleus_macros", registry = "gitea" }
tokio = { version = "1.38.0", features = [
    "rt-multi-thread",
    "rt",
    "macros",
    "net",
    "tracing",
    "io-util",
    "signal",
    "time",
] }
tokio-util = "0.7.11"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
async-trait = "0.1.80"
futures = "0.3.30"
prost = "0.12.6"
bytes = "1.11.1"
lazy_static = "1.5.0"
type-map = "0.5.0"
dashmap = "6.0.1"
rand = "0.8.5"
async-scoped = { version = "0.9.0", features = ["tokio", "use-tokio"] }
opentelemetry = { version = "0.29.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.29.0", features = ["rt-tokio"] }
tracing-opentelemetry = "0.30.0"
ph = "0.8.5"
metrics = "0.24.1"
nohash-hasher = "0.2.0"
snowflake = { version = "1.0.0", registry = "gitea" }
fxhash = "0.2.1"
linkme = { version = "0.3.33", optional = true }
tracing-core = "0.1.34"
smallbox = { version = "0.8.8", features = ["coerce"] }
kanal = { version = "0.1.3", features = [
    "async",
], optional = true, registry = "gitea" }


[dev-dependencies]
criterion = { version = "0.7.0" }


[features]
default = ["metrics", "debug", "kanal", "unbounded_remote_node"]
metrics = []
client = []
debug = []
static_registry = ["linkme", "nucleus_macros/static_registry"]
smallbox = ["nucleus_macros/smallbox"]
kanal = ["dep:kanal"]
unbounded_remote_node = []

[build-dependencies]
prost-build = "0.12.6"

# [profile.test]
# inherits = "release"
